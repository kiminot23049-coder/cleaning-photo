<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>清掃写真報告</title>

  <!-- ホーム画面に追加したときにアプリのように全画面で開く -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="清掃写真">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    }
    /* ノッチやホームバーに重ならないように余白を取る */
    .frame-wrap {
      position: fixed;
      top: env(safe-area-inset-top); bottom: env(safe-area-inset-bottom);
      left: env(safe-area-inset-left); right: env(safe-area-inset-right);
    }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
    .loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #888; font-size: 15px; pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">読み込み中…</div>
  <div class="frame-wrap">
    <!--
      ▼ここを清掃写真報告アプリ(GAS)のウェブアプリURLに置き換えてください
        (「デプロイを管理」に表示される、末尾が /exec のURL)
      allow の web-share は「まとめて保存」の共有シート、camera は撮影用です
    -->
    <iframe
      id="app"
      src="https://script.google.com/macros/s/AKfycbwqgk5X4t55B0OsF727NsDE2BDDnbPGajVTBRqPUnq42_ImHgg4F13kccSZFBCi2bUF/exec"
      allow="web-share; camera; clipboard-write"
      onload="document.getElementById('loading').style.display='none'"></iframe>
  </div>
</body>
</html>
